<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Submit a product review for Apex Coffee Craft.">
    <title>Apex Coffee Craft | Review</title>
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
    <script src="scripts/getdates.js" defer></script>
</head>
<body>
    <header>
        <h1>Apex Coffee Craft</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="place.html">Our Location</a>
            <a href="form.html" class="active">Review Us</a>
        </nav>
    </header>

    <main>
        <h2>Product Review</h2>
        <form method="get" action="review.html" id="reviewForm">
            <div class="form-item">
                <label for="productName">Product Name</label>
                <select id="productName" name="productName" required>
                    <option value="" disabled selected>Select a product...</option>
                </select>
            </div>

            <div class="form-item">
                <label>Overall Rating</label>
                <div class="rating-group">
                    <label><input type="radio" name="rating" value="1" required> ☆</label>
                    <label><input type="radio" name="rating" value="2"> ☆☆</label>
                    <label><input type="radio" name="rating" value="3"> ☆☆☆</label>
                    <label><input type="radio" name="rating" value="4"> ☆☆☆☆</label>
                    <label><input type="radio" name="rating" value="5"> ☆☆☆☆☆</label>
                </div>
            </div>

            <div class="form-item">
                <label for="installDate">Date of Purchase</label>
                <input type="date" id="installDate" name="installDate" required>
            </div>

            <div class="form-item">
                <label for="writtenReview">Written Review (Optional)</label>
                <textarea id="writtenReview" name="writtenReview" rows="4"></textarea>
            </div>

            <div class="form-item">
                <label for="userName">Your Name (Optional)</label>
                <input type="text" id="userName" name="userName">
            </div>

            <div class="form-item">
                <input type="submit" value="Post Review" class="submit-btn">
            </div>
        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Apex Coffee Craft | <a href="siteplan.html">Site Plan & References</a></p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
