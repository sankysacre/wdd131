<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form - Apex Coffee Crafters</title>
    <meta name="description" content="Submit a product review for Apex Coffee Crafters products and accessories.">
    <meta name="author" content="Senga Sanky Sacre">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>

    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">
            
            <!-- Product Name -->
            <div class="form-item">
                <label for="productName">Product Name <span class="required-asterisk">*</span></label>
                <select id="productName" name="productName" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </div>

            <!-- Overall Rating -->
            <fieldset class="form-item">
                <legend>Overall Rating <span class="required-asterisk">*</span></legend>
                <div class="rating-group">
                    <input type="radio" id="star5" name="rating" value="5" required>
                    <label for="star5" title="5 Stars">★</label>

                    <input type="radio" id="star4" name="rating" value="4" required>
                    <label for="star4" title="4 Stars">★</label>

                    <input type="radio" id="star3" name="rating" value="3" required>
                    <label for="star3" title="3 Stars">★</label>

                    <input type="radio" id="star2" name="rating" value="2" required>
                    <label for="star2" title="2 Stars">★</label>

                    <input type="radio" id="star1" name="rating" value="1" required>
                    <label for="star1" title="1 Star">★</label>
                </div>
            </fieldset>

            <!-- Date of Installation -->
            <div class="form-item">
                <label for="installDate">Date of Installation <span class="required-asterisk">*</span></label>
                <input type="date" id="installDate" name="installDate" required>
            </div>

            <!-- Useful Features -->
            <fieldset class="form-item">
                <legend>Which features did you find useful? (Check all that apply)</legend>
                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="feature1" name="features" value="durability">
                        <label for="feature1">Durability</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="feature2" name="features" value="ease-of-use">
                        <label for="feature2">Ease of Use</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="feature3" name="features" value="performance">
                        <label for="feature3">Performance</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="feature4" name="features" value="design">
                        <label for="feature4">Design &amp; Aesthetics</label>
                    </div>
                </div>
            </fieldset>

            <!-- Written Review -->
            <div class="form-item">
                <label for="writtenReview">Written Review (Optional)</label>
                <textarea id="writtenReview" name="writtenReview" rows="4" placeholder="Share details of your experience with this product..."></textarea>
            </div>

            <!-- User Name -->
            <div class="form-item">
                <label for="userName">Your Name (Optional)</label>
                <input type="text" id="userName" name="userName" placeholder="e.g. Jane Doe">
            </div>

            <!-- Submit Button -->
            <div class="form-item">
                <input type="submit" value="Post Review" class="submit-btn">
            </div>

        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Apex Coffee Crafters | Senga Sanky Sacre | WDD 131</p>
        <p id="lastModified"></p>
    </footer>

</body>
</html>
